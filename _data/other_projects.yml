- id: dhe
  kicker: Dartmouth Humanitarian Engineering
  title: Solar Water-Heating System in Uganda
  subtitle: >
    Designed and installed a solar thermal water heating system in rural Uganda, balancing cost, 
    reliability, and field constraints to create a system that continues operating today.
  images:
    - src: /img/dhe/dhe-construction-1.jpg
      caption: DHE Construction
    - src: /img/dhe/dhe-system-labeled.png
      caption: DHE System
    - src: /img/dhe/dhe-1.png
      caption: DHE system
  body: >
    I co-led the design, implementation, and testing of an off-grid solar water heating system 
    to displace the use of firewood for cooking at a 10,000 student university in Kampala, Uganda. 
