- id: classd
  # kicker: Power electronics
  title: Class-D Audio Amplifier
  # subtitle: Buck-converter powertrain · ~96% efficiency
  subtitle: >
    I designed, simulated, built, and tested a Class-D amplifier using a buck converter topology 
    to deliver high-efficiency audio output to a 4 Ω speaker. The design achieved over 
    96% peak efficiency and clean tracking of a sinusoidal audio input from 100 Hz to 20 kHz.
  images:
    - src: /img/engs125/engs125-pcb.png
      caption: Populated board (hand-soldered)
    - src: /img/engs125/engs125-performance-D50-Vin12V-Rload4Ohms.png
      caption: Bench test — D=50%, 12 V in, 4 Ω load
  body: >
    I designed, simulated, built, and tested a Class-D amplifier using a buck converter topology 
    to deliver high-efficiency audio output to a 4 Ω speaker. The design achieved over 
    96% peak efficiency and clean tracking of a sinusoidal audio input from 100 Hz to 20 kHz.
  # body: >
  #   A buck-converter power stage for a Class-D audio amp, driving a 20 kHz signal into a 4 Ω
  #   load from 12 V. I optimized it in LTspice, laid out a low-inductance board in Altium,
  #   hand-soldered it, and bench-tested it against spec — it reached ~96% efficiency and
  #   exceeded every requirement.
  # tags: [Power electronics, LTspice, Altium]
  page: /classd/

- id: printing
  # kicker: CAD / mechanical
  # title: 3D-printed design projects
  title: Custom Car-Mounted Phone Holder
  # subtitle: SolidWorks + design-for-print (DFM)
  # subtitle: Personal Mechanical Design Project
  subtitle: >
    I designed and 3D printed a custom phone holder that mounts into a slot behind my car’s center console.
  images:
    - src: /img/3dprints/phoneholder_driver_view.jpg
      caption: Phone holder final print, driver view
    - src: /img/3dprints/phoneholder_back.jpg
      caption: 'Phone holder print: hook holding it in place, behind the console'
  # images: []                       # add: stick-clip iterations, phone mount, SolidWorks screenshots
  body: >
    <div class="dive">
      <div class="dive__text">
        <p>I was tired of fighting with every phone mount I tried: suction cups that slowly fell off, 
          mounts that shifted while driving, and holders that launched my phone across the car when braking. 
          Since I rely on my phone for navigation, I wanted a solution… so why not make it myself? 
        </p>
        <h4>Designing around real-world constraints</h4>
        <div>
        <p>My first prototype successfully fit into the slot behind the console slot, 
        but exposed several unforseen issues:</p>
        <ul>
          <li>• phone fit was too loose, allowing unwanted movement on bumps</li>
          <li>• holder partially blocked the air vents</li> 
          <li>• single-piece design geometry required extensive print supports,
          resulting in a rough surface finish and inefficient print process</li>
        </ul>
        </div>
      </div>
      <figure class="dive__media"><img src="/img/3dprints/v1_annotated.jpg" alt=""></figure>
    </div>

    <div class="trio">
      <figure>
        <h4>Iterating!</h4>
        <p>In the second iteration, I split the holder into two separate components fastened together with screws.</p>
      </figure>
      <figure>
        <img src="/img/3dprints/phoneholder_driver_view.jpg" alt="">
      </figure>
      <figure>
        <img src="/img/3dprints/phoneholder_back.jpg" alt="">
      </figure>
    </div>
  # tags: [SolidWorks, DFM, 3D printing]

- id: amradio
  # kicker: RF / analog
  title: Transistor-level heterodyne receiver
  # title: AM radio receiver
  subtitle: >
    I built a transistor-level 455 kHz IF receiver with dual LNAs, switching mixer, ceramic filter, 
    IF amplifier, envelope detector, and audio power amplifier output stage. I simulated my design in 
    LTSpice, then validated the gain of the breadboarded circuit using a modulated 1.4 MHz input from 
    function generator and an oscilloscope, then demonstrated functionality with an audio input and headphones.
  images:
    - src: /img/engs61/engs61-breadboard.jpg
    - src: /img/engs61/engs61-scope.png
      caption: Measured demodulated output
    - src: /img/engs61/engs61-breadboard-annotated.png
      caption: Breadboard, stages annotated
    - src: /img/engs61/engs61-schematic-handdrawn.png
      caption: Schematic of Final Circuit
  # body: >
  #   A transistor-level heterodyne AM receiver that demodulates and amplifies a broadcast
  #   signal into 32 Ω headphones. I designed it, simulated it in LTspice, and built it on a
  #   breadboard, then compared measured against simulated: overall gain came out 47.5 V/V
  #   measured versus 46.0 V/V simulated — close agreement for a breadboarded MF circuit.
  body: >
    I designed, simulated, and built a transistor-level radio receiver circuit to demodulate and 
    amplify an AM radio wave into a pair of headphones. I completed this project in 2 weeks as part of 
    the course ENGS 61: Intermediate Electrical Circuits. The measured results differed from the 
    expected results – as expected, since I was testing a medium frequency circuit using a breadboarded implementation.
    
    <h3>Schematic of Final Circuit</h3>
    <div>
        <img src="img/engs61/engs61-schematic-handdrawn.png" style="width:70%">
    </div>
    <br>

    <h3>Annotated photo of breadboard</h3>
    <div>
        <img src="img/engs61/engs61-breadboard-annotated.png" style="width:70%">
    </div>
    <br>

    <h3>Measured output of breadboarded circuit</h3>
    <div>
        <img src="img/engs61/engs61-scope.png" style="width:70%">
    </div>
    <p>gain of breadboarded circuit = 285 mV / 6 mV = 47.5 V/V</p>
    <br>

    <h3>Comparison of LTSpice sim to measurement</h3>
    <p>reciever input: 1.4 MHz carrier with 1 kHz audio tone at modulation depth = 40%</p>
    <div>
        <img src="img/engs61/engs61-ltspice.png" style="width:70%">
    </div>
    <br>

    <h3>Overall voltage gain of the circuit</h3>
    <ul>
      <li>LTSpice Simulation: 46.03 V/V</li>
      <li>Breadboarded Circuit, Measured: 47.5 V/V</li>
    </ul>

  # tags: [RF, Analog, LTspice]

